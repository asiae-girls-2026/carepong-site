<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PILLYMON — 64×64 도트펫</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root{--paper:#fbeede;--ink:#2b2440;--red:#ff4d5e;--lcd:#cdeeae;}
      *{margin:0;box-sizing:border-box}
      body{font-family:'Galmuri11',monospace;color:var(--ink);background:var(--paper);
        background-image:radial-gradient(#f1ddc0 1.5px,transparent 1.6px);background-size:14px 14px;
        min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
      h1{font-family:'Press Start 2P';font-size:18px;text-shadow:4px 4px 0 var(--red);margin-bottom:10px}
      .sub{color:#5a4f72;margin-bottom:24px;font-size:14px;text-align:center;max-width:560px;line-height:1.7}
      .stage{background:var(--lcd);border:6px solid var(--ink);width:360px;height:240px;position:relative;
        overflow:hidden;margin-bottom:14px;box-shadow:inset 0 0 0 4px #b7df9a,10px 10px 0 var(--ink)}
      .stage::after{content:'';position:absolute;inset:0;pointer-events:none;
        background:repeating-linear-gradient(transparent 0 3px,rgba(52,86,58,.07) 3px 4px)}
      #pet{position:absolute;bottom:34px;image-rendering:pixelated;height:150px}
      .spk{position:absolute;font-size:18px;pointer-events:none;animation:tw 1.6s ease-in-out infinite;z-index:5}
      .spk:nth-child(1){top:24px;right:30px;animation-delay:0s;color:#ff9ec7}
      .spk:nth-child(2){top:70px;right:18px;animation-delay:.5s;color:#b89cff}
      .spk:nth-child(3){top:120px;right:40px;animation-delay:1s;color:#ff9ec7}
      .spk:nth-child(4){top:40px;left:26px;animation-delay:.8s;color:#b89cff}
      @keyframes tw{0%,100%{opacity:.12;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(15deg)}}
      .cmp{display:flex;gap:24px;background:#fff;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px 22px;align-items:flex-end;margin-top:6px}
      .cmp .c{text-align:center}.cmp img{image-rendering:pixelated;height:120px;display:block;margin:0 auto 8px}
      .cmp .cap{font-family:'Press Start 2P';font-size:9px;color:var(--red)}
      .note{margin-top:22px;font-size:13px;color:#5a4f72;max-width:620px;text-align:center;line-height:1.8}
    </style>
  </head>
  <body>
    <h1>64×64 DOT PET</h1>
    <p class="sub">GPT가 만든 도트 → <b>깔끔한 64×64로 트레이싱 + 배경/반짝이 제거 + 애니</b>. 걸어다니며 윙크해요 😉</p>
    <div class="stage">
      <div class="spk">✦</div><div class="spk">✧</div><div class="spk">✦</div><div class="spk">✧</div>
      <img id="pet" src="dot/axo64.png" />
    </div>
    <div class="cmp">
      <div class="c"><img src="dot/axo64.png" /><div class="cap">TRACED 64²</div></div>
      <div class="c"><img src="dot/axo64_blink.png" /><div class="cap">WINK</div></div>
    </div>
    <p class="note">
      트레이싱본은 <b>깔끔한 64×64 격자</b>라 게임에 바로 쓰고 프레임 애니도 얹혀요.<br />
      양쪽 눈 동시 깜빡임·걷는 다리 프레임은 눈/다리 좌표만 지정하면 완성돼요.
    </p>
    <script>
      const pet=document.getElementById('pet'),box=pet.parentElement;
      let x=40,dir=1,winkUntil=0,lastWink=0;
      function flip(){pet.style.transform=dir===1?'scaleX(1)':'scaleX(-1)'}
      function loop(t){
        if(t-lastWink>3000){winkUntil=t+220;lastWink=t}
        pet.src=t<winkUntil?'dot/axo64_blink.png':'dot/axo64.png';
        x+=0.32*dir; const maxX=box.clientWidth-pet.clientWidth-12;
        if(x>maxX){x=maxX;dir=-1;flip()} if(x<12){x=12;dir=1;flip()}
        pet.style.left=x+'px'; pet.style.bottom=(34+Math.abs(Math.sin(t/240))*5)+'px';
        requestAnimationFrame(loop);
      }
      flip();requestAnimationFrame(loop);
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PILLYMON — 완성 샘플 (우파루파)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root{--paper:#fbeede;--ink:#2b2440;--red:#ff4d5e;--lcd:#cdeeae;}
      *{margin:0;box-sizing:border-box}
      body{font-family:'Galmuri11',monospace;color:var(--ink);background:var(--paper);
        background-image:radial-gradient(#f1ddc0 1.5px,transparent 1.6px);background-size:14px 14px;
        min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
      h1{font-family:'Press Start 2P';font-size:18px;text-shadow:4px 4px 0 var(--red);margin-bottom:10px}
      .sub{color:#5a4f72;margin-bottom:24px;font-size:14px;text-align:center}
      .stage{background:var(--lcd);border:6px solid var(--ink);width:380px;height:260px;position:relative;
        overflow:hidden;box-shadow:inset 0 0 0 4px #b7df9a,12px 12px 0 var(--ink)}
      .stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
        background:repeating-linear-gradient(transparent 0 3px,rgba(52,86,58,.08) 3px 4px)}
      #pet{position:absolute;bottom:36px;image-rendering:pixelated;height:150px;z-index:2}
      .spk{position:absolute;font-size:20px;pointer-events:none;animation:tw 1.7s ease-in-out infinite;z-index:3}
      .spk:nth-child(1){top:28px;right:34px;color:#ff9ec7;animation-delay:0s}
      .spk:nth-child(2){top:84px;right:22px;color:#b89cff;animation-delay:.45s}
      .spk:nth-child(3){top:140px;right:46px;color:#ff9ec7;animation-delay:.9s}
      .spk:nth-child(4){top:46px;left:30px;color:#b89cff;animation-delay:.7s}
      .spk:nth-child(5){top:120px;left:24px;color:#ff9ec7;animation-delay:1.2s}
      @keyframes tw{0%,100%{opacity:.1;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
      .hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:4;
        font-family:'Press Start 2P';font-size:9px;color:#34563a}
      .cap{margin-top:16px;font-size:13px;color:#5a4f72;text-align:center;max-width:560px;line-height:1.8}
      .tag{display:inline-block;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:11px;padding:4px 9px;margin:4px}
    </style>
  </head>
  <body>
    <h1>PILLYMON · 완성 샘플</h1>
    <p class="sub">우파루파 — 걸어다니고, 양쪽 눈 깜빡이고, 반짝여요 ✨</p>
    <div class="stage">
      <div class="hud"><span>♥♥♥</span><span>Lv.3</span></div>
      <div class="spk">✦</div><div class="spk">✧</div><div class="spk">✦</div><div class="spk">✧</div><div class="spk">✦</div>
      <img id="pet" src="dot/axo-hd.png" />
    </div>
    <p class="cap">
      <span class="tag">128px 마스터</span><span class="tag">게임에선 작게</span><span class="tag">눈깜빡임 ✓</span><span class="tag">반짝이 ✓</span><br />
      ※ 이 자세는 정면 배깔이라 <b>통통 걷기(hop)</b>예요. 다리를 번갈아 딛는 진짜 워크는 <b>옆/걷는 자세</b> 레퍼런스면 됩니다.
    </p>
    <script>
      const pet=document.getElementById('pet'),box=pet.parentElement;
      let x=50,dir=1,blinkUntil=0,lastBlink=0;
      function flip(){pet.style.transform=dir===1?'scaleX(1)':'scaleX(-1)'}
      function loop(t){
        if(t-lastBlink>2800){blinkUntil=t+200;lastBlink=t}
        pet.src=t<blinkUntil?'dot/axo-hd_blink.png':'dot/axo-hd.png';
        x+=0.30*dir; const maxX=box.clientWidth-pet.clientWidth-14;
        if(x>maxX){x=maxX;dir=-1;flip()} if(x<14){x=14;dir=1;flip()}
        pet.style.left=x+'px';
        pet.style.bottom=(36+Math.abs(Math.sin(t/210))*7)+'px'; // hop
        requestAnimationFrame(loop);
      }
      flip();requestAnimationFrame(loop);
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PILLYMON — 진짜 다리걷기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root{--paper:#fbeede;--ink:#2b2440;--red:#ff4d5e;--lcd:#cdeeae;}
      *{margin:0;box-sizing:border-box}
      body{font-family:'Galmuri11',monospace;color:var(--ink);background:var(--paper);
        background-image:radial-gradient(#f1ddc0 1.5px,transparent 1.6px);background-size:14px 14px;
        min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
      h1{font-family:'Press Start 2P';font-size:18px;text-shadow:4px 4px 0 var(--red);margin-bottom:10px}
      .sub{color:#5a4f72;margin-bottom:24px;font-size:14px;text-align:center}
      .stage{background:var(--lcd);border:6px solid var(--ink);width:400px;height:230px;position:relative;
        overflow:hidden;box-shadow:inset 0 0 0 4px #b7df9a,12px 12px 0 var(--ink)}
      .stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
        background:repeating-linear-gradient(transparent 0 3px,rgba(52,86,58,.08) 3px 4px)}
      .ground{position:absolute;left:0;right:0;bottom:40px;height:3px;background:#34563a;opacity:.25;z-index:1}
      #pet{position:absolute;bottom:40px;image-rendering:pixelated;height:130px;z-index:2}
      .spk{position:absolute;font-size:18px;pointer-events:none;animation:tw 1.7s ease-in-out infinite;z-index:3}
      .spk:nth-child(1){top:26px;right:34px;color:#ff9ec7;animation-delay:0s}
      .spk:nth-child(2){top:80px;right:22px;color:#b89cff;animation-delay:.5s}
      .spk:nth-child(3){top:40px;left:30px;color:#ff9ec7;animation-delay:.9s}
      @keyframes tw{0%,100%{opacity:.1;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}
      .frames{margin-top:18px;background:#fff;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:16px 20px;display:flex;gap:22px;align-items:flex-end}
      .frames img{image-rendering:pixelated;height:90px;display:block;margin:0 auto 6px}
      .frames .cap{font-family:'Press Start 2P';font-size:9px;color:var(--red);text-align:center}
      .cap2{margin-top:16px;font-size:13px;color:#5a4f72;text-align:center;max-width:560px;line-height:1.8}
    </style>
  </head>
  <body>
    <h1>PILLYMON · 진짜 다리걷기</h1>
    <p class="sub">손으로 작도한 옆모습 — 다리 4개가 번갈아 딛으며 걸어요 🚶</p>
    <div class="stage">
      <div class="ground"></div>
      <div class="spk">✦</div><div class="spk">✧</div><div class="spk">✦</div>
      <img id="pet" src="hand/side_0.png" />
    </div>
    <div class="frames">
      <div><img src="hand/side_0.png" /><div class="cap">STEP A</div></div>
      <div><img src="hand/side_1.png" /><div class="cap">STEP B</div></div>
    </div>
    <p class="cap2">옆/걷는 자세라 <b>다리가 분리</b>돼서 진짜 워크가 돼요. 깔끔한 외곽선 + 제 손 안의 픽셀이라 수정·확장 자유로워요.<br />(아가미 풍성함·표정 등 더 다듬을 수 있어요.)</p>
    <script>
      const pet=document.getElementById('pet'),box=pet.parentElement;
      let x=60,dir=-1,frame=0,lastSwap=0;
      function flip(){pet.style.transform=dir===-1?'scaleX(1)':'scaleX(-1)'} // art faces left
      function loop(t){
        if(t-lastSwap>180){frame^=1;lastSwap=t}
        pet.src=frame?'hand/side_1.png':'hand/side_0.png';
        x+=0.5*dir; const maxX=box.clientWidth-pet.clientWidth-16;
        if(x>maxX){x=maxX;dir=-1;flip()} if(x<16){x=16;dir=1;flip()}
        pet.style.left=x+'px';
        pet.style.bottom=(40+(frame?1:0))+'px'; // tiny bob with steps
        requestAnimationFrame(loop);
      }
      flip();requestAnimationFrame(loop);
    </script>
  </body>
</html>
